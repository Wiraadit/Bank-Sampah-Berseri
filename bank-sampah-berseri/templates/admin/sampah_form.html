{{define "content"}}
<h1 class="page-title">{{if .Data.IsEdit}}Edit Jenis Sampah{{else}}Tambah Jenis Sampah{{end}}</h1>

<div class="card form-card">
  <form method="post" action="{{if .Data.IsEdit}}/admin/sampah/{{.Data.ID}}{{else}}/admin/sampah{{end}}">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">

    <label for="nama_jenis">Nama Jenis *</label>
    <input type="text" id="nama_jenis" name="nama_jenis" value="{{.Data.Nama}}" maxlength="50"
           {{if .Data.NamaTerkunci}}disabled{{else}}required{{end}}>
    {{if .Data.NamaTerkunci}}
      <small class="muted">Nama jenis ini dikunci karena dipakai oleh proses pemilahan.</small>
    {{end}}

    <label for="harga_beli">Harga Beli per kg (Rp) *</label>
    <input type="text" id="harga_beli" name="harga_beli" value="{{.Data.HargaBeli}}"
           inputmode="numeric" placeholder="1500" required>

    <label for="harga_jual">Harga Jual per kg (Rp) *</label>
    <input type="text" id="harga_jual" name="harga_jual" value="{{.Data.HargaJual}}"
           inputmode="numeric" placeholder="2000" required>
    <small class="muted">Isi angka saja tanpa titik atau koma.</small>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Simpan</button>
      <a href="/admin/sampah" class="btn btn-outline">Batal</a>
    </div>
  </form>
</div>
{{end}}
