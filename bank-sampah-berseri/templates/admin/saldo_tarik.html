{{define "content"}}
<div class="page-header">
  <h1 class="page-title">Penarikan Saldo Nasabah</h1>
  <a href="/admin/saldo" class="btn btn-outline">Kembali ke Keuangan</a>
</div>

<div class="card form-card" style="max-width: 600px; margin: 0 auto;">
  <form method="post" action="/admin/saldo/tarik" id="form-tarik">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">

    <div class="form-group" style="margin-bottom: 16px;">
      <label for="nasabah_id">Pilih Nasabah *</label>
      <select id="nasabah_id" name="nasabah_id" required style="width: 100%; padding: 10px; border-radius: var(--radius); border: 1px solid var(--gray-200);">
        <option value="">-- Pilih Nasabah Aktif --</option>
        {{range .Data.NasabahList}}
        <option value="{{.ID}}"
                data-saldo="{{.Saldo}}"
                {{if eq .ID $.Data.SelectedNasabahID}}selected{{end}}>
          {{.KodeNasabah}} - {{.Nama}} (Saldo: {{rupiah .Saldo}})
        </option>
        {{end}}
      </select>
    </div>

    <div id="saldo-box" class="stat-grid" style="display: none; margin-bottom: 16px;">
      <div class="stat">
        <div class="stat-label">Saldo Saat Ini</div>
        <div class="stat-value" id="disp-saldo">Rp 0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Batas Maksimal Ditarik</div>
        <div class="stat-value" id="disp-maks-tarik" style="color: var(--green-600);">Rp 0</div>
        <div class="stat-sub">Sisa saldo minimal Rp 10.000</div>
      </div>
    </div>

    <div class="form-group" style="margin-bottom: 20px;">
      <label for="nominal">Nominal Penarikan (Rp) *</label>
      <input type="number" id="nominal" name="nominal" step="1000" min="1000" placeholder="Contoh: 50000" required
             style="font-size: 1.2rem; font-weight: 700; padding: 10px;">
      <small class="muted" style="display: block; margin-top: 4px;">
        Sesuai aturan Bab 5.6: Saldo tabungan setelah penarikan minimal Rp 10.000.
      </small>
    </div>

    <div id="disp-estimasi" style="display: none; padding: 12px; border-radius: var(--radius); margin-bottom: 20px;"></div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" id="btn-submit" style="padding: 10px 20px;">
        💸 Proses Penarikan Uang
      </button>
      <a href="/admin/saldo" class="btn btn-outline">Batal</a>
    </div>
  </form>
</div>
{{end}}

{{define "scripts"}}
<script>
(function() {
  const selNasabah = document.getElementById('nasabah_id');
  const saldoBox = document.getElementById('saldo-box');
  const dispSaldo = document.getElementById('disp-saldo');
  const dispMaks = document.getElementById('disp-maks-tarik');
  const inNominal = document.getElementById('nominal');
  const dispEstimasi = document.getElementById('disp-estimasi');
  const btnSubmit = document.getElementById('btn-submit');

  const MIN_SALDO = 10000;

  function formatRupiah(num) {
    const val = Math.round(num);
    const neg = val < 0;
    const abs = Math.abs(val);
    const str = abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (neg ? "-Rp " : "Rp ") + str;
  }

  function updateNasabah() {
    const opt = selNasabah.options[selNasabah.selectedIndex];
    if (!opt || !opt.value) {
      saldoBox.style.display = 'none';
      dispEstimasi.style.display = 'none';
      return;
    }

    const saldo = parseFloat(opt.dataset.saldo || 0);
    const maksTarik = Math.max(0, saldo - MIN_SALDO);

    dispSaldo.textContent = formatRupiah(saldo);
    dispMaks.textContent = formatRupiah(maksTarik);
    saldoBox.style.display = 'grid';

    inNominal.max = maksTarik;
    cekNominal();
  }

  function cekNominal() {
    const opt = selNasabah.options[selNasabah.selectedIndex];
    if (!opt || !opt.value) return;

    const saldo = parseFloat(opt.dataset.saldo || 0);
    const nom = parseFloat(inNominal.value || 0);
    const sisa = saldo - nom;

    if (nom <= 0) {
      dispEstimasi.style.display = 'none';
      btnSubmit.disabled = false;
      return;
    }

    dispEstimasi.style.display = 'block';
    if (sisa < MIN_SALDO) {
      dispEstimasi.style.background = 'var(--red-50)';
      dispEstimasi.style.color = 'var(--red-700)';
      dispEstimasi.style.border = '1px solid var(--red-600)';
      dispEstimasi.textContent = `⚠ Penarikan ditolak: Sisa saldo nasabah menjadi ${formatRupiah(sisa)}, kurang dari batas minimal Rp 10.000.`;
      btnSubmit.disabled = true;
    } else {
      dispEstimasi.style.background = 'var(--green-50)';
      dispEstimasi.style.color = 'var(--green-700)';
      dispEstimasi.style.border = '1px solid var(--green-600)';
      dispEstimasi.textContent = `✓ Penarikan valid. Estimasi sisa saldo nasabah: ${formatRupiah(sisa)}.`;
      btnSubmit.disabled = false;
    }
  }

  selNasabah.addEventListener('change', updateNasabah);
  inNominal.addEventListener('input', cekNominal);

  if (selNasabah.value) {
    updateNasabah();
  }
})();
</script>
{{end}}
