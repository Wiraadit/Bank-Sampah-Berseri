{{define "content"}}
<h1 class="page-title">{{if .Data.IsEdit}}Edit Nasabah{{else}}Tambah Nasabah{{end}}</h1>

<div class="card form-card">
  <form method="post" action="{{if .Data.IsEdit}}/admin/nasabah/{{.Data.ID}}{{else}}/admin/nasabah{{end}}">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">

    {{if .Data.IsEdit}}
      <label>Kode Nasabah</label>
      <input type="text" value="{{.Data.Kode}}" disabled>
      <label>Username</label>
      <input type="text" value="{{.Data.Username}}" disabled>
    {{end}}

    <label for="nama">Nama *</label>
    <input type="text" id="nama" name="nama" value="{{.Data.Nama}}" maxlength="100" required>

    <label for="alamat">Alamat</label>
    <textarea id="alamat" name="alamat" rows="3" maxlength="500">{{.Data.Alamat}}</textarea>

    <label for="no_telepon">No. Telepon</label>
    <input type="tel" id="no_telepon" name="no_telepon" value="{{.Data.NoTelepon}}" placeholder="08123456789">

    {{if not .Data.IsEdit}}
      <hr>
      <p class="muted">Akun login nasabah. Kode nasabah dibuat otomatis.</p>
      <label for="username">Username *</label>
      <input type="text" id="username" name="username" value="{{.Data.Username}}" autocomplete="off" required>

      <label for="password">Password Awal * (min. 8 karakter)</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required>
    {{end}}

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Simpan</button>
      <a href="{{if .Data.IsEdit}}/admin/nasabah/{{.Data.ID}}{{else}}/admin/nasabah{{end}}" class="btn btn-outline">Batal</a>
    </div>
  </form>
</div>
{{end}}
